appId: com.workside.sageset
name: SageSet pauses an active workout plan
tags: [sageset, phase5, plan-pause, emulator-only]
---
- launchApp: { clearState: true, clearKeychain: true }
- extendedWaitUntil: { visible: { id: screen.auth.welcome }, timeout: 30000 }
- tapOn: { id: auth.welcome.login }
- extendedWaitUntil: { visible: { id: screen.auth.login }, timeout: 15000 }
- tapOn: { id: auth.login.email }
- inputText: { text: "${SAGESET_MAESTRO_USER_A_EMAIL}", label: Enter deterministic QA User A email }
- tapOn: { id: auth.login.password }
- inputText: { text: "${SAGESET_MAESTRO_USER_A_PASSWORD}", label: Enter deterministic QA User A password }
- hideKeyboard
- tapOn: { id: auth.login.submit, enabled: true }
- runFlow:
    when: { visible: "Not Now" }
    commands: [{ tapOn: "Not Now" }]
- extendedWaitUntil: { visible: { id: screen.today.ready }, timeout: 45000 }
- scrollUntilVisible: { element: { id: plan.pause.open }, direction: DOWN, timeout: 30000, visibilityPercentage: 80 }
- tapOn: { id: plan.pause.open }
- extendedWaitUntil: { visible: { id: plan.pause.modal }, timeout: 15000 }
- assertVisible: { id: plan.pause.reason.vacation, selected: true }
- assertVisible: { id: plan.pause.return.unsure, selected: true }
- tapOn: { id: plan.pause.confirm }
- extendedWaitUntil: { visible: '^OK$', timeout: 30000 }
- tapOn: '^OK$'
- extendedWaitUntil: { visible: { id: plan.status.paused }, timeout: 45000 }
- assertVisible: { id: plan.resume.open }
- assertNotVisible: { id: today.workout.maestro-strength-a.title }
