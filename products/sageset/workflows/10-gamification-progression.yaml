appId: com.workside.sageset
name: SageSet deterministic progression smoke
tags:
  - sageset
  - phase1
  - gamification
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: screen.auth.welcome
    timeout: 30000
- tapOn:
    id: auth.welcome.login
- extendedWaitUntil:
    visible:
      id: screen.auth.login
    timeout: 15000
- tapOn:
    id: auth.login.email
- inputText:
    text: ${SAGESET_MAESTRO_USER_A_EMAIL}
    label: Enter deterministic QA User A email
- tapOn:
    id: auth.login.password
- inputText:
    text: ${SAGESET_MAESTRO_USER_A_PASSWORD}
    label: Enter deterministic QA User A password
- hideKeyboard
- tapOn:
    id: auth.login.submit
    enabled: true
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: screen.today.ready
    timeout: 45000
- scrollUntilVisible:
    element:
      id: gamification.progression.open
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 80
- tapOn:
    id: gamification.progression.open
- extendedWaitUntil:
    visible:
      id: gamification.progression.score
    timeout: 45000
- assertVisible:
    id: screen.gamification.progression
- assertVisible:
    id: gamification.progression.score
- assertVisible:
    text: '^100$'
- scrollUntilVisible:
    element:
      id: gamification.progression.xp
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 70
- assertVisible:
    id: gamification.progression.xp
- assertVisible:
    text: '^400 lifetime XP$'
- scrollUntilVisible:
    element:
      id: gamification.progression.achievements
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 60
- assertVisible:
    id: gamification.progression.achievements
- assertVisible:
    text: '^First Workout$'
