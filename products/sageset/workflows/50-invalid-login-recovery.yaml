appId: com.workside.sageset
name: SageSet invalid login recovery
tags:
  - sageset
  - phase4
  - negative-path
  - recovery
  - emulator-only
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: screen.auth.welcome
    timeout: 30000
- tapOn:
    id: auth.welcome.login
- extendedWaitUntil:
    visible:
      id: screen.auth.login
    timeout: 15000
- tapOn:
    id: auth.login.email
- inputText:
    text: ${SAGESET_MAESTRO_USER_A_EMAIL}
    label: Enter deterministic QA User A email
- tapOn:
    id: auth.login.password
- inputText:
    text: MaestroWrongPassword123!
    label: Enter intentionally invalid password
- hideKeyboard
- tapOn:
    id: auth.login.submit
    enabled: true
- extendedWaitUntil:
    visible:
      id: auth.login.error
    timeout: 30000
- assertNotVisible:
    id: screen.today.ready
- tapOn:
    id: auth.login.password
- eraseText: 64
- inputText:
    text: ${SAGESET_MAESTRO_USER_A_PASSWORD}
    label: Replace with deterministic QA User A password
- hideKeyboard
- tapOn:
    id: auth.login.submit
    enabled: true
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: screen.today.ready
    timeout: 45000
- assertVisible:
    id: tab.challenges
