appId: com.workside.sageset
name: SageSet resume group member mutation
tags:
  - sageset
  - phase3
  - social
  - mutation
  - emulator-only
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: screen.auth.welcome
    timeout: 30000
- tapOn:
    id: auth.welcome.login
- extendedWaitUntil:
    visible:
      id: screen.auth.login
    timeout: 15000
- tapOn:
    id: auth.login.email
- inputText:
    text: ${SAGESET_MAESTRO_USER_A_EMAIL}
    label: Enter deterministic QA User A email
- tapOn:
    id: auth.login.password
- inputText:
    text: ${SAGESET_MAESTRO_USER_A_PASSWORD}
    label: Enter deterministic QA User A password
- hideKeyboard
- tapOn:
    id: auth.login.submit
    enabled: true
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: screen.today.ready
    timeout: 45000
- tapOn:
    id: tab.challenges
- extendedWaitUntil:
    visible:
      id: screen.challenges.ready
    timeout: 45000
- tapOn:
    id: challenges.groups.open
- extendedWaitUntil:
    visible:
      id: screen.social-challenges.ready
    timeout: 45000
- scrollUntilVisible:
    element:
      id: social.group.maestro-group
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 60
- tapOn:
    id: social.group.maestro-group.members
- scrollUntilVisible:
    element:
      id: social.member.maestro_b.resume
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 80
- tapOn:
    id: social.member.maestro_b.resume
- extendedWaitUntil:
    visible:
      id: social.member.confirmation
    timeout: 10000
- tapOn:
    id: social.member.confirm.resume
- extendedWaitUntil:
    visible:
      id: social.member.maestro_b.pause
    timeout: 30000
- assertVisible:
    id: social.member.maestro_b.row
- assertVisible:
    id: social.member.maestro_b.status
- assertVisible:
    text: '^Active$'
- assertNotVisible:
    id: social.member.maestro_b.resume
