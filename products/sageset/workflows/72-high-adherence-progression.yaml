appId: com.workside.sageset
name: SageSet progresses future reps after high adherence
tags: [sageset, phase6, coaching, progression, emulator-only]
---
- launchApp: { clearState: true, clearKeychain: true }
- extendedWaitUntil: { visible: { id: screen.auth.welcome }, timeout: 30000 }
- tapOn: { id: auth.welcome.login }
- extendedWaitUntil: { visible: { id: screen.auth.login }, timeout: 15000 }
- tapOn: { id: auth.login.email }
- inputText: { text: "${SAGESET_MAESTRO_USER_A_EMAIL}", label: Enter deterministic QA User A email }
- tapOn: { id: auth.login.password }
- inputText: { text: "${SAGESET_MAESTRO_USER_A_PASSWORD}", label: Enter deterministic QA User A password }
- hideKeyboard
- tapOn: { id: auth.login.submit, enabled: true }
- runFlow:
    when: { visible: "Not Now" }
    commands: [{ tapOn: "Not Now" }]
- extendedWaitUntil: { visible: { id: screen.today.ready }, timeout: 45000 }
- scrollUntilVisible: { element: { id: coaching.review.title }, direction: DOWN, timeout: 30000, visibilityPercentage: 80 }
- assertVisible: { id: coaching.review.adherence, text: '^100%$' }
- assertVisible: { id: coaching.review.missed, text: '^0$' }
- scrollUntilVisible: { element: { id: coaching.review.recommendation }, direction: DOWN, timeout: 30000, visibilityPercentage: 80 }
- assertVisible: { id: coaching.review.recommendation, text: '^Your recent adherence supports a small progression, applied only where upcoming workouts are still incomplete\.$' }
- scrollUntilVisible: { element: { id: coaching.review.accept }, direction: DOWN, timeout: 30000, visibilityPercentage: 80 }
- swipe:
    start: "50%,75%"
    end: "50%,35%"
    duration: 500
- assertVisible: { id: coaching.review.accept, enabled: true }
- tapOn: { id: coaching.review.accept }
- extendedWaitUntil: { visible: { id: coaching.review.confirm.accept }, timeout: 15000 }
- tapOn: { id: coaching.review.confirm.accept }
- extendedWaitUntil: { notVisible: { id: coaching.review.title }, timeout: 45000 }
