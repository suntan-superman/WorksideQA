appId: com.workside.sageset
name: SageSet join group challenge mutation
tags:
  - sageset
  - phase3
  - social
  - mutation
  - emulator-only
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: screen.auth.welcome
    timeout: 30000
- tapOn:
    id: auth.welcome.login
- extendedWaitUntil:
    visible:
      id: screen.auth.login
    timeout: 15000
- tapOn:
    id: auth.login.email
- inputText:
    text: ${SAGESET_MAESTRO_USER_B_EMAIL}
    label: Enter deterministic QA User B email
- tapOn:
    id: auth.login.password
- inputText:
    text: ${SAGESET_MAESTRO_USER_B_PASSWORD}
    label: Enter deterministic QA User B password
- hideKeyboard
- tapOn:
    id: auth.login.submit
    enabled: true
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: screen.today.ready
    timeout: 45000
- tapOn:
    id: tab.challenges
- extendedWaitUntil:
    visible:
      id: screen.challenges.ready
    timeout: 45000
- tapOn:
    id: challenges.groups.open
- extendedWaitUntil:
    visible:
      id: screen.social-challenges.ready
    timeout: 45000
- scrollUntilVisible:
    element:
      id: social.challenge.maestro-weekly-squats.action
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 80
- assertVisible:
    text: '^Join Challenge$'
- tapOn:
    id: social.challenge.maestro-weekly-squats.action
- extendedWaitUntil:
    visible:
      text: '^Challenge joined$'
    timeout: 30000
- assertVisible:
    text: '^Challenge joined$'
- tapOn:
    text: '^OK$'
- scrollUntilVisible:
    element:
      id: social.challenge.maestro-weekly-squats.action
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 80
- assertVisible:
    id: social.challenge.maestro-weekly-squats.action
- assertVisible:
    text: '^Tracking Unavailable$'
