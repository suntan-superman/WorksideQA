appId: com.workside.sageset
name: SageSet pending group invitation
tags:
  - sageset
  - phase2
  - social
  - invitation
  - emulator-only
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: screen.auth.welcome
    timeout: 30000
- tapOn:
    id: auth.welcome.login
- extendedWaitUntil:
    visible:
      id: screen.auth.login
    timeout: 15000
- tapOn:
    id: auth.login.email
- inputText:
    text: ${SAGESET_MAESTRO_USER_B_EMAIL}
    label: Enter deterministic QA User B email
- tapOn:
    id: auth.login.password
- inputText:
    text: ${SAGESET_MAESTRO_USER_B_PASSWORD}
    label: Enter deterministic QA User B password
- hideKeyboard
- tapOn:
    id: auth.login.submit
    enabled: true
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: screen.today.ready
    timeout: 45000
- tapOn:
    id: tab.challenges
- extendedWaitUntil:
    visible:
      id: screen.challenges.ready
    timeout: 45000
- tapOn:
    id: challenges.groups.open
- extendedWaitUntil:
    visible:
      id: screen.social-challenges.ready
    timeout: 45000
- assertVisible:
    id: social.invitation.maestro-invitation
- assertVisible:
    id: social.invitation.maestro-invitation.accept
- assertVisible:
    id: social.invitation.maestro-invitation.decline
- assertVisible:
    text: '^@maestro_a invited you to Maestro Group\.$'

