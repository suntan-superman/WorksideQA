appId: com.workside.sageset
name: SageSet groups and challenges navigation smoke
tags:
  - sageset
  - phase1
  - gamification
  - social
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: screen.today.ready
    timeout: 45000
- tapOn:
    id: tab.challenges
- extendedWaitUntil:
    visible:
      id: screen.challenges.ready
    timeout: 45000
- assertVisible:
    id: challenges.groups.open
- tapOn:
    id: challenges.groups.open
- extendedWaitUntil:
    visible:
      id: screen.social-challenges.ready
    timeout: 45000
- assertVisible:
    id: screen.social-challenges.ready
