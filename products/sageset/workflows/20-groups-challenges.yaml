appId: com.workside.sageset
name: SageSet groups and challenges navigation smoke
tags:
  - sageset
  - phase1
  - gamification
  - social
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: screen.auth.welcome
    timeout: 30000
- tapOn:
    id: auth.welcome.login
- extendedWaitUntil:
    visible:
      id: screen.auth.login
    timeout: 15000
- tapOn:
    id: auth.login.email
- inputText:
    text: ${SAGESET_MAESTRO_USER_A_EMAIL}
    label: Enter deterministic QA User A email
- tapOn:
    id: auth.login.password
- inputText:
    text: ${SAGESET_MAESTRO_USER_A_PASSWORD}
    label: Enter deterministic QA User A password
- hideKeyboard
- tapOn:
    id: auth.login.submit
    enabled: true
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: screen.today.ready
    timeout: 45000
- tapOn:
    id: tab.challenges
- extendedWaitUntil:
    visible:
      id: screen.challenges.ready
    timeout: 45000
- assertVisible:
    id: challenges.groups.open
- tapOn:
    id: challenges.groups.open
- extendedWaitUntil:
    visible:
      id: screen.social-challenges.ready
    timeout: 45000
- assertVisible:
    id: screen.social-challenges.ready
