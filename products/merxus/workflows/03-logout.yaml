appId: com.merxus.mobile.qa
---
- launchApp:
    clearState: true
- tapOn:
    id: auth.login.email
- eraseText: 128
- inputText: ${MERXUS_MAESTRO_OWNER_A_EMAIL}
- tapOn:
    id: auth.login.password
- eraseText: 128
- inputText: ${MERXUS_MAESTRO_OWNER_A_PASSWORD}
- hideKeyboard
- assertVisible:
    id: auth.login.submit
    enabled: true
- tapOn:
    id: auth.login.submit
- extendedWaitUntil:
    visible:
      id: screen.dashboard.ready
    timeout: 20000
- assertVisible:
    id: settings.open
- tapOn:
    id: settings.logout
- assertVisible:
    id: settings.logout.confirmation
- tapOn:
    id: settings.logout.confirm
- extendedWaitUntil:
    visible:
      id: screen.auth.login
    timeout: 10000
- assertNotVisible:
    id: screen.dashboard.ready
- assertNotVisible: Merxus Maestro Tenant A
