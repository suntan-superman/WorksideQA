appId: com.merxus.mobile.qa
---
- launchApp:
    clearState: true
- assertVisible:
    id: qa-environment-root
- assertVisible:
    id: qa-environment-value
- assertVisible:
    id: qa-application-id
- assertVisible:
    id: qa-firebase-project
- assertVisible:
    id: qa-backend-host
- assertVisible:
    id: screen.auth.login
- assertNotVisible:
    id: qa-configuration-error
- tapOn:
    id: auth.login.email
- eraseText: 128
- inputText: ${MERXUS_MAESTRO_OWNER_A_EMAIL}
- tapOn:
    id: auth.login.password
- eraseText: 128
- inputText: ${MERXUS_MAESTRO_OWNER_A_PASSWORD}
- hideKeyboard
- assertVisible:
    id: auth.login.submit
    enabled: true
- tapOn:
    id: auth.login.submit
- extendedWaitUntil:
    visible:
      id: screen.dashboard.ready
    timeout: 20000
