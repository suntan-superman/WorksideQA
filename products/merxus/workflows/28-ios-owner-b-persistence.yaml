appId: com.merxus.mobile.qa
---
- launchApp:
    clearState: true
- assertVisible:
    id: screen.auth.login
- tapOn:
    id: auth.login.email
- eraseText: 128
- inputText: ${MERXUS_MAESTRO_OWNER_B_EMAIL}
- tapOn:
    id: auth.login.password
- eraseText: 128
- inputText: ${MERXUS_MAESTRO_OWNER_B_PASSWORD}
- hideKeyboard
- assertVisible:
    id: auth.login.submit
    enabled: true
- tapOn:
    id: auth.login.submit
- extendedWaitUntil:
    visible:
      id: screen.dashboard.ready
    timeout: 20000
- assertVisible:
    id: dashboard.tenant.name
    text: 'Merxus Maestro Tenant B'
- assertVisible:
    id: dashboard.user.role
    text: 'owner'
- tapOn:
    id: settings.open
- extendedWaitUntil:
    visible:
      id: screen.settings.ready
    timeout: 15000
- assertVisible:
    id: settings.tenant.id
    text: 'merxus-maestro-tenant-b'
- assertVisible:
    id: settings.user.role
    text: 'owner'
- scrollUntilVisible:
    element:
      id: settings.sms.open
    direction: DOWN
- tapOn:
    id: settings.sms.open
- extendedWaitUntil:
    visible:
      id: settings.sms.qa-notification-retry-max-attempts-value
      text: '^2$'
    timeout: 10000
- assertVisible:
    id: settings.sms.qa-notification-retry-max-attempts-value
    text: '^2$'
- tapOn:
    id: settings.sms.qa-set-notification-retry-max-attempts
- extendedWaitUntil:
    visible:
      id: settings.sms.qa-notification-retry-max-attempts-value
      text: '^3$'
    timeout: 5000
- assertVisible:
    id: settings.sms.qa-notification-retry-max-attempts-value
    text: '^3$'
- scrollUntilVisible:
    element:
      id: settings.sms.save
    direction: DOWN
    timeout: 20000
    centerElement: true
- extendedWaitUntil:
    visible:
      id: settings.sms.save
    timeout: 5000
- assertVisible:
    id: settings.sms.save
    enabled: true
- tapOn:
    id: settings.sms.save
- extendedWaitUntil:
    visible:
      id: settings.sms.saved
    timeout: 15000
- copyTextFrom:
    id: settings.sms.request-id
- evalScript: ${output.settingsRequestId = maestro.copiedText}
- copyTextFrom:
    id: settings.sms.operation-id
- evalScript: >-
    ${console.log('WORKSIDEQA_CORRELATION=' + JSON.stringify({requestId: output.settingsRequestId, operationId: maestro.copiedText}))}
- scrollUntilVisible:
    element:
      id: settings.sms.reload
    direction: DOWN
    timeout: 20000
    centerElement: true
- extendedWaitUntil:
    visible:
      id: settings.sms.reload
    timeout: 5000
- tapOn:
    id: settings.sms.reload
- extendedWaitUntil:
    visible:
      id: settings.sms.reloaded
    timeout: 15000
- assertVisible:
    id: settings.sms.notification-retry-max-attempts
    text: '^3$'
