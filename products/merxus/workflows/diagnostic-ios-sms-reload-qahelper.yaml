appId: com.merxus.mobile.qa
---
- launchApp:
    clearState: true
- assertVisible:
    id: screen.auth.login
- tapOn:
    id: auth.login.email
- eraseText: 128
- inputText: ${MERXUS_MAESTRO_OWNER_B_EMAIL}
- tapOn:
    id: auth.login.password
- eraseText: 128
- inputText: ${MERXUS_MAESTRO_OWNER_B_PASSWORD}
- hideKeyboard
- assertVisible:
    id: auth.login.submit
    enabled: true
- tapOn:
    id: auth.login.submit
- extendedWaitUntil:
    visible:
      id: screen.dashboard.ready
    timeout: 20000
- assertVisible:
    id: dashboard.tenant.name
    text: 'Merxus Maestro Tenant B'
- assertVisible:
    id: dashboard.user.role
    text: 'owner'
- tapOn:
    id: settings.open
- extendedWaitUntil:
    visible:
      id: screen.settings.ready
    timeout: 15000
- assertVisible:
    id: settings.tenant.id
    text: 'merxus-maestro-tenant-b'
- assertVisible:
    id: settings.user.role
    text: 'owner'
- scrollUntilVisible:
    element:
      id: settings.sms.open
    direction: DOWN
- tapOn:
    id: settings.sms.open
- scrollUntilVisible:
    element:
      id: settings.sms.notification-retry-max-attempts
    direction: DOWN
    centerElement: true
- assertVisible:
    id: settings.sms.notification-retry-max-attempts
    text: '^2$'
- assertVisible:
    id: settings.sms.qa-reload-state
    text: '^idle$'
- tapOn:
    id: settings.sms.qa-reload
- extendedWaitUntil:
    visible:
      id: settings.sms.qa-reload-state
      text: '^hydrated$'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: settings.sms.reloaded
    direction: DOWN
    timeout: 5000
    centerElement: true
- assertVisible:
    id: settings.sms.reloaded
- scrollUntilVisible:
    element:
      id: settings.sms.notification-retry-max-attempts
    direction: UP
    timeout: 5000
    centerElement: true
- assertVisible:
    id: settings.sms.notification-retry-max-attempts
    text: '^2$'
